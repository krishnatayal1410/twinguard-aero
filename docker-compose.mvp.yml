services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.mvp
    ports:
      - "8000:8000"
    volumes:
      - ./data/runtime:/app/data/runtime

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.mvp
    command: ["python", "simulator/run_simulator.py"]
    environment:
      TWINGUARD_TELEMETRY_API: http://backend:8000/telemetry
      TWINGUARD_CONTROL_API: http://backend:8000/simulation/control
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.mvp
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
