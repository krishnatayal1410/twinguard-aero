# Deploy from the repository root. Paid resources: review pricing before applying.
services:
  - type: web
    name: twinguard-api
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: TWINGUARD_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "0"
      - key: TWINGUARD_INGEST_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: twinguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://twinguard-aero.vercel.app
      - key: TRUSTED_HOSTS
        sync: false
      - key: TWINGUARD_NATIVE_ML
        value: "0"
      - key: MQTT_ENABLED
        value: "0"
databases:
  - name: twinguard-db
    plan: basic-256mb
    ipAllowList: []
