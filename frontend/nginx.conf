server{
 listen 80;server_name _;root /usr/share/nginx/html;index index.html;
 add_header X-Content-Type-Options nosniff always;add_header X-Frame-Options DENY always;add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /{try_files $uri /index.html;}
 location /api/v1/ws/{proxy_pass http://backend:8000/api/v1/ws/;proxy_http_version 1.1;proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection "upgrade";proxy_set_header Host $host;}
 location /api/{proxy_pass http://backend:8000/api/;proxy_http_version 1.1;proxy_set_header Host $host;}
}