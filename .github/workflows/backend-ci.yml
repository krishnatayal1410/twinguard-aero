name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "ai/**"
      - "simulator/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ai/**"
      - "simulator/**"
      - "scripts/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
