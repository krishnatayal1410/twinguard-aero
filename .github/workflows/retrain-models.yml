name: Retrain TwinGuard Synthetic Models

on:
  push:
    branches: [sih26054-overhaul]
    paths:
      - .github/workflows/retrain-models.yml

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sih26054-overhaul
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: python -m pip install numpy scikit-learn xgboost joblib
      - name: Train aero-piston v2 synthetic model pack
        run: python ai/train_models.py
      - name: Validate synthetic metrics
        run: |
          python - <<'PY'
          import json
          m=json.load(open('models/synthetic_metrics.json'))
          print(m)
          assert m['fault_macro_f1'] >= 0.80
          assert m['rul_r2'] >= 0.40
          PY
      - name: Validate artifact contract loads
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          TWINGUARD_NATIVE_ML: '1'
        run: |
          python - <<'PY'
          from app.services.ai_engine import AIEngine, FEATURES, SUPPORTED_LABELS
          ai=AIEngine('models')
          assert ai.native_ml, ai.model_warning
          assert ai.fault is not None and ai.rul is not None and ai.anomaly is not None
          assert ai.artifact_features == FEATURES
          assert ai.labels == SUPPORTED_LABELS
          print('PASS: aero-piston-v2 artifacts are runtime-compatible')
          PY
      - name: Commit retrained model pack to overhaul branch
        run: |
          git config user.name "TwinGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add models/anomaly_model.joblib models/fault_model.joblib models/rul_model.joblib models/fault_labels.json models/feature_order.json models/synthetic_metrics.json models/model_manifest.json
          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi
          git commit -m "Retrain aero-piston v2 synthetic model pack"
          git push origin HEAD:sih26054-overhaul
